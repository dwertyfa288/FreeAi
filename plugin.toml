version = "0.2.0"
description = "Automatic model routing for chat, image and video generation"
author = "dwertyfa"
license = "MIT"
icon = "icon.svg"

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
ai_provider = true
tools = true
ui_contributions = true